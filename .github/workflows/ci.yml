name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly freshness sweep
    - cron: '17 5 * * *'

env:
  # The commands CI runs live in yatr.toml, so `yatr <task>` locally is the same gate.
  YATR_VERSION: "1.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - name: Params, build, internal links, design system audit, citations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yatr ci

  lighthouse:
    # Runs against a local preview of the real build. Blocking on accessibility
    # and performance: this job caught nine contrast violations that the bespoke
    # style audit passed, so it is the one that actually protects readers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - name: Serve and audit
        run: yatr browser

  contrast:
    # Blocking. An accessibility regression is not a matter of taste.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - run: yatr contrast

  staleness:
    # Non-blocking on a pull request, so a contributor is not punished for
    # somebody else's page going stale. Strict on the nightly schedule, where
    # going red is the entire point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - name: Freshness report
        run: yatr ${{ github.event_name == 'schedule' && 'staleness-strict' || 'staleness' }}
      - name: Outbound links
        if: github.event_name == 'schedule'
        run: yatr links-external

  chain:
    # Reads the deployed contracts on Arbitrum One over a public RPC and
    # compares them against the registry. No secrets, so unlike `reconcile`
    # below it actually runs, and it runs on every push rather than nightly.
    # This is the job that would have caught the GIP-0089 figures being wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - name: Reconcile against Arbitrum One
        run: yatr chain

  reconcile:
    # Reads the network subgraph for the values a contract call cannot give,
    # and reports drift. Needs a gateway key, so it skips more often than not;
    # `chain` above is the tier underneath it that always runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}
      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""
      - name: Reconcile against chain
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
          NETWORK_SUBGRAPH_URL: ${{ secrets.NETWORK_SUBGRAPH_URL }}
          NETWORK_SUBGRAPH_QUERY: ${{ secrets.NETWORK_SUBGRAPH_QUERY }}
        run: yatr reconcile
